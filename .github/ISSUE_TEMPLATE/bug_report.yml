name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG]: "
labels:
  - bug
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CalorieCounter.

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open app
        2. Add a meal
        3. Save
        4. Observe issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Food Search
        - Meal Logging
        - Nutrition Tracking
        - Dashboard
        - Goals
        - Settings
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 17 / iPhone 16 Pro

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: iOS 18 / iOS 17

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Leave empty if not needed

