name: Feature Request
description: Suggest an idea or enhancement
title: "[FEATURE]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make CalorieCounter better? We'd love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: I find it difficult to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Describe your ideal solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: Any alternative approaches?

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Food Logging
        - Nutrition Analysis
        - Barcode Scanner
        - Meal Planning
        - Weight Tracking
        - Dashboard
        - Notifications
        - AI Features
        - Performance
        - UI / UX
        - Accessibility
        - Other

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Screenshots
      description: Attach sketches or screenshots if available.

  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      placeholder: How would this improve the app?
